<h2>Authors</h2>
<form #authorForm="ngForm" (ngSubmit)="onSubmit()">
  <label for="author-id">Author ID</label>
  <input id="author-id" name="authorId" type="number" min="1" step="1" required [(ngModel)]="authorId" />
  <button type="submit" [disabled]="authorForm.invalid">Search</button>
</form>
@if (selectedAuthor) {
  <div>
    <h3>Here are details of the Author {{ selectedAuthor.id }}</h3>
    <div class="row">
      <div class="col-3">First name:</div>
      <div class="col-9">{{ selectedAuthor.firstName }}</div>
    </div>
    <div class="row">
      <div class="col-3">Last name:</div>
      <div class="col-9">{{ selectedAuthor.lastName }}</div>
    </div>
    <div class="row" [hidden]="!selectedAuthor.books?.length">
      <div class="col-3">Books:</div>
      <div class="col-9">{{ bookTitles() }}</div>
    </div>
  </div>
}
@else if (searched) {
  <div>
    <h3>Sorry can't find the requested author...</h3>
  </div>
}
